<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <title>FLEX — Offline</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #0b0b0d;
        color: #f2efe6;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .card {
        max-width: 360px;
        width: 100%;
        background: #151518;
        border: 1px solid #2a2a31;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 0 60px rgba(212, 175, 55, 0.08);
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 {
        margin: 20px 0 8px;
        font-size: 28px;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, #f5d77a, #d4af37 60%, #a8841f);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p { margin: 0 0 24px; color: #9a968c; line-height: 1.5; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 700;
        color: #0b0b0d;
        background: linear-gradient(135deg, #f5d77a, #d4af37);
        cursor: pointer;
      }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>YOU'RE OFFLINE</h1>
      <p>Even the richest need signal. Reconnect to get back on the leaderboard.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
